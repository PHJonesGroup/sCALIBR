# -------------------- Parameters --------------------

input_counts    : "data/crispr_raw_counts.csv"
output_dir      : "output/"
keep_counts     : [1, 4]                        #number of gRNAs expected per genes
alf             : 0.06                          # significance level of right-left tail of distribution

# Patterns for filtering 
target_type     : 'GOI'    
control_type    : 'Zero-expressed gene'
contrasts:
  - name: T1_vs_T0                              # two replicates contrast
    baseline: [T0_F, T0_M]
    cond1:    [T1_F, T1_M]
  - name: T1_vs_T0_F_only                       # one replicate contrast
    baseline: [T0_F]
    cond1:    [T1_F]

# Plotting parameters
st              : -10                           # x axis start
en              : 10                            # x axis end
step            : 0.05                          # bin steps
thr_lfchz       : 1.7                           # LCF threshold